name: Build and Release Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ACTIONS_RUNNER_DEBUG: false
  CI_COMMIT_MESSAGE: CI Build Artifacts

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build:
    name: Build extension artifact
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.0

      - name: Setup yq
        uses: chrisdickinson/setup-yq@v1.0.1
        with:
          yq-version: v4.28.2

      - name: Setup Nodejs and npm
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Setup yarn
        run: npm install -g yarn

      - name: Setup Nodejs with yarn caching
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Run build script
        shell: bash
        id: build_script
        run: |
          yarn publish-pkgs -s "${{ github.repository }}" -b gh-pages

      # Package the proxy Helm chart into the same tmp/ layout that
      # publish-pkgs produces so the release job commits both charts to
      # gh-pages in one go. Skipped when the chart version is already in the
      # published Helm index — that's how "if it has changed" is detected.
      - name: Package proxy Helm chart if new
        id: proxy_pkg
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIR=proxy/helm/suse-manager-proxy
          NAME="$(yq eval '.name' "$CHART_DIR/Chart.yaml")"
          VERSION="$(yq eval '.version' "$CHART_DIR/Chart.yaml")"

          echo "Proxy chart: ${NAME}-${VERSION}"

          # Fetch the currently-published Helm index. Missing file is fine —
          # it just means gh-pages hasn't been initialised yet.
          EXISTING_INDEX=/tmp/gh-pages-index.yaml
          rm -f "$EXISTING_INDEX"
          wget -qO "$EXISTING_INDEX" \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/index.yaml" || true

          if [ -s "$EXISTING_INDEX" ] && \
             yq eval ".entries[\"${NAME}\"][]? | select(.version == \"${VERSION}\") | .version" "$EXISTING_INDEX" \
             | grep -qx "${VERSION}"; then
            echo "Proxy chart ${NAME}-${VERSION} is already in the Helm index; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure the tmp/ layout exists even if publish-pkgs skipped it
          # (extension had no version bump but proxy did).
          mkdir -p "tmp/assets/${NAME}" "tmp/charts/${NAME}/${VERSION}" tmp/extensions

          helm package "$CHART_DIR" -d "tmp/assets/${NAME}"
          cp -R "$CHART_DIR/." "tmp/charts/${NAME}/${VERSION}/"

          # Regenerate the top-level index.yaml with the proxy chart included.
          # Prefer the extension-updated index emitted by publish-pkgs (already
          # merged with prior gh-pages state); fall back to the raw gh-pages
          # index if publish-pkgs didn't produce one this run.
          MERGE_BASE=""
          if [ -f tmp/index.yaml ]; then
            MERGE_BASE="tmp/index.yaml"
          elif [ -s "$EXISTING_INDEX" ]; then
            MERGE_BASE="$EXISTING_INDEX"
          fi

          if [ -n "$MERGE_BASE" ]; then
            helm repo index tmp/assets --url assets/ --merge "$MERGE_BASE"
          else
            helm repo index tmp/assets --url assets/
          fi
          mv tmp/assets/index.yaml tmp/index.yaml

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload charts artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v3
        with:
          name: charts
          path: tmp

  release:
    name: Release Build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: gh-pages

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: charts

      - name: Commit build
        run: |
          git add ./{assets,charts,extensions,index.yaml}
          git commit -a -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.4.1
        with:
          charts_dir: ./charts/*
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CR_SKIP_EXISTING: true
